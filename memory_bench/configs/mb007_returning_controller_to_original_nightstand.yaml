session_id: mb007_returning_controller_to_original_nightstand
paths:
  omnigibson_data_root: /data/bwang/code/BEHAVIOR-1K/datasets
  intervent_rawdata_root: /data/bwang/datasets/2026-challenge-rawdata
  output_root: /data/bwang/code/BEHAVIOR-1K/outputs/memory_bench
benchmark:
  level: 2
scene_model: house_double_floor_upper
memory_room: bedroom_1
instance_sampling:
  count: 150
  seed: 0
assets:
  requirements:
    controller:
      source: insert
      instances: [gaming_controller.n.01_1]
    storage_box:
      source: insert
      instances: [toy_box.n.01_1]
    nightstands:
      source: scene
      instances: [stand.n.04_1, stand.n.04_2]
    bed:
      source: scene
      instances: [bed.n.01_1]
    footstool:
      source: scene
      instances: [footstool.n.01_1]
segments:
  key_1:
    role: key_task
    activity: mb_putting_controller_in_box
    room_id: bedroom_1
    depends_on: []
  key_2:
    role: key_task
    activity: mb_moving_controller_box_to_ottoman
    room_id: bedroom_1
    depends_on: [key_1]
  intervent_1:
    role: intervent_task
    activity: organizing_art_supplies
    room_id: bedroom_0
    source: {task_id: 59}
    depends_on: []
  intervent_2:
    role: intervent_task
    activity: re_shelving_library_books
    room_id: living_room_0
    source: {task_id: 55}
    depends_on: []
  query:
    role: query_task
    activity: mb_returning_controller_to_original_nightstand
    room_id: bedroom_1
    depends_on: [key_1, key_2]
composition:
  demo_id: 1
  order_seed: 1
  instance_id: null
  task_orders:
    - [key_1, intervent_1, key_2, intervent_2, query]
    - [intervent_1, key_1, key_2, intervent_2, query]
    - [key_1, intervent_2, key_2, intervent_1, query]
bridge:
  action_frequency: 30
  max_base_linear_velocity: 0.4
  max_base_angular_velocity: 0.5
export:
  obs_modalities: [proprio, rgb, depth_linear]
  n_render_iterations: 3
  sensor_config:
    VisionSensor:
      sensor_kwargs: {image_height: 480, image_width: 480}
    "zed_link:Camera:0":
      sensor_kwargs: {horizontal_aperture: 40, image_height: 720, image_width: 720}
