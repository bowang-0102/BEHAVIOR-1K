session_id: mb_retrieve_target_mug_after_relocation
paths:
  data_root: /data2/bwang/code/BEHAVIOR-1K/datasets
  intervent_rawdata_root: /data2/bwang/datasets/2026-challenge-rawdata
  output_root: /data2/bwang/datasets/memory-bench
benchmark:
  level: 2
scene_model: house_single_floor
memory_room: kitchen_0
instance_sampling:
  count: 150
  seed: 1
case_sampling:
  seed: 1
intervent_selection:
  candidate_count_per_task: 200
assets:
  manifest: sessions/mb_retrieve_target_mug_after_relocation/assets.json
  requirements:
    target_mug:
      source: insert
      instances: [mug.n.04_1, mug.n.04_2]
      appearance: distinct_models
    top_cabinets:
      source: scene_or_insert
      instances: [cabinet.n.01_1, cabinet.n.01_2, cabinet.n.01_3]
    island:
      source: scene
      instances: [countertop.n.01_1]
segments:
  key_1:
    role: key_task
    activity: mb_identify_target_mug
    room_id: kitchen_0
    depends_on: []
  key_2:
    role: key_task
    activity: mb_relocate_two_mugs
    room_id: kitchen_0
    depends_on: [key_1]
  intervent_1:
    role: intervent_task
    activity: tidying_bedroom
    instruction: tidying bedroom
    room_id: bedroom_0
    source: {task_id: 18}
    depends_on: []
  intervent_2:
    role: intervent_task
    activity: outfit_a_basic_toolbox
    instruction: outfit a basic toolbox
    room_id: utility_room_0
    source: {task_id: 19}
    depends_on: []
  query:
    role: query_task
    activity: mb_retrieve_target_mug_after_relocation
    room_id: kitchen_0
    depends_on: [key_1, key_2]
composition:
  task_orders:
    - [key_1, intervent_1, key_2, intervent_2, query]
    - [intervent_1, key_1, intervent_2, key_2, query]
    - [intervent_2, key_1, intervent_1, key_2, query]
query_start:
  sampler: room_free_space
  room_id: kitchen_0
  orientation: uniform_yaw
  seed: 7921
scene_preparation:
  full_scene: true
  doorway_sampling:
    policy: open_configured_doorways
    status: preliminary_until_physical_calibration
  doorways:
    open_before_snapshot: true
    categories: [door, interior_door, doorway]
collection:
  key_segment_ids: [key_1, key_2]
  advance_segment_key: N
validation:
  state_tolerances:
    status: preliminary_until_physical_calibration
    ignored_fields: [is_asleep, lin_vel, ang_vel]
    numeric: {default: 0.001, pos: 0.02, ori: 0.05, joint_pos: 0.02, joint_vel: 0.02}
  robot_boundary:
    status: preliminary_until_physical_calibration
    yaw_tolerance: 0.05
    linear_velocity: 0.03
    angular_velocity: 0.05
    joint_velocity: 0.05
bridge:
  robot: R1Pro
  action_frequency: 30
  limits_status: preliminary_until_physical_calibration
  max_base_linear_velocity: 0.2
  max_base_angular_velocity: 0.5
  stop_pose: R1Pro_reset
export:
  obs_modalities: [proprio, rgb, depth_linear]
  n_render_iterations: 3
  sensor_config:
    VisionSensor:
      sensor_kwargs: {image_height: 480, image_width: 480}
    "zed_link:Camera:0":
      sensor_kwargs: {horizontal_aperture: 40, image_height: 720, image_width: 720}
