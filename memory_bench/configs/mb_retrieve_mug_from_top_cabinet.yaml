session_id: mb_retrieve_mug_from_top_cabinet
paths:
  data_root: /data/bwang/code/BEHAVIOR-1K/datasets
  intervent_rawdata_root: /data/bwang/datasets/2026-challenge-rawdata
  output_root: /data/bwang/datasets/memory-bench
benchmark:
  level: 1
scene_model: house_single_floor
memory_room: kitchen_0
instance_sampling:
  count: 150
  seed: 0
intervent_selection:
  candidate_count_per_task: 200
assets:
  manifest: sessions/mb_retrieve_mug_from_top_cabinet/assets.json
  requirements:
    mug:
      source: scene_or_insert
      instances: [mug.n.04_1]
    target_cabinets:
      source: scene_or_insert
      instances: [cabinet.n.01_1, cabinet.n.01_2, cabinet.n.01_3]
    island:
      source: scene
      instances: [countertop.n.01_1]
segments:
  key_1:
    role: key_task
    activity: mb_mug_into_top_cabinet
    room_id: kitchen_0
    depends_on: []
  intervent_1:
    role: intervent_task
    activity: tidying_bedroom
    room_id: bedroom_0
    source: {task_id: 18}
    depends_on: []
  intervent_2:
    role: intervent_task
    activity: outfit_a_basic_toolbox
    room_id: utility_room_0
    source: {task_id: 19}
    depends_on: []
  query:
    role: query_task
    activity: mb_retrieve_mug_from_top_cabinet
    room_id: kitchen_0
    depends_on: [key_1]
composition:
  task_orders:
    - [key_1, intervent_1, intervent_2, query]
    - [intervent_1, key_1, intervent_2, query]
    - [intervent_2, key_1, intervent_1, query]
query_start:
  room_id: kitchen_0
  seed: 7919
scene_preparation:
  doorways:
    open_before_snapshot: true
    categories: [door, interior_door, doorway]
collection:
  key_segment_ids: [key_1]
bridge:
  action_frequency: 30
  max_base_linear_velocity: 0.2
  max_base_angular_velocity: 0.5
export:
  obs_modalities: [proprio, rgb, depth_linear]
  n_render_iterations: 3
  sensor_config:
    VisionSensor:
      sensor_kwargs: {image_height: 480, image_width: 480}
    "zed_link:Camera:0":
      sensor_kwargs: {horizontal_aperture: 40, image_height: 720, image_width: 720}
