session_id: mb005_return_bowl_and_cutting_board
paths:
  omnigibson_data_root: /data/bwang/code/BEHAVIOR-1K/datasets
  intervent_rawdata_root: /data/bwang/datasets/2026-challenge-rawdata
  output_root: /data/bwang/code/BEHAVIOR-1K/outputs/memory_bench
benchmark:
  level: 2
scene_model: house_single_floor
memory_room: kitchen_0
instance_sampling:
  count: 150
  seed: 0
assets:
  requirements:
    bowls:
      source: insert
      instances: [bowl.n.01_1, vessel.n.03_1]
    cutting_board:
      source: insert
      instances: [chopping_board.n.01_1]
    counters:
      source: scene
      instances: [countertop.n.01_1, countertop.n.01_2, countertop.n.01_3]
    shelves:
      source: scene
      instances: [shelf.n.01_1, shelf.n.01_2]
segments:
  key_1:
    role: key_task
    activity: mb_place_bowl_on_bar
    room_id: kitchen_0
    depends_on: []
  key_2:
    role: key_task
    activity: mb_place_cutting_board_on_bar
    room_id: kitchen_0
    depends_on: [key_1]
  intervent_1:
    role: intervent_task
    activity: organizing_school_stuff
    room_id: bedroom_0
    source: {task_id: 73}
    depends_on: []
  intervent_2:
    role: intervent_task
    activity: picking_up_toys
    room_id: childs_room_0
    source: {task_id: 7}
    depends_on: []
  query:
    role: query_task
    activity: mb_return_bowl_and_cutting_board
    room_id: kitchen_0
    depends_on: [key_1, key_2]
composition:
  demo_id: 1
  order_seed: 1
  instance_id: null
  task_orders:
    - [key_1, intervent_1, key_2, intervent_2, query]
    - [intervent_1, key_1, key_2, intervent_2, query]
    - [key_1, intervent_2, key_2, intervent_1, query]
bridge:
  action_frequency: 30
  max_base_linear_velocity: 0.4
  max_base_angular_velocity: 0.5
export:
  obs_modalities: [proprio, rgb, depth_linear]
  n_render_iterations: 3
  sensor_config:
    VisionSensor:
      sensor_kwargs: {image_height: 480, image_width: 480}
    "zed_link:Camera:0":
      sensor_kwargs: {horizontal_aperture: 40, image_height: 720, image_width: 720}
