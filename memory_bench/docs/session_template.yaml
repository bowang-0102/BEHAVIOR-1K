# 正式 K/I/Q 全流程模板：以已注册的下层巧克力 Level 1 任务为例。
# 更换任务时，activity 和 BDDL 角色必须与 tasks/ 中对应的任务定义匹配。
# 字段用途、默认值与代码入口见 configuration.md。

# 1. 本次数据属于哪个任务，在哪里读写。
session_id: mb_retrieve_chocolate_from_top_cabinet # 必须等于 Query 的 activity；也是输出分组名。
scene_model: house_double_floor_lower      # 场景模型；需与任务定义和录制素材匹配。
memory_room: kitchen_0                     # 所有 K/Q 共享的记忆房间；I 使用其他房间。
benchmark:
  level: 1                                # 一个 Key 为 1，两个或更多 Key 为 2。
paths:
  data_root: /data5/bwang/code/BEHAVIOR-1K/datasets # OmniGibson 资产及任务实例根目录。
  intervent_rawdata_root: /data5/bwang/datasets/2026-challenge-rawdata # 已有 I 录制根目录。
  output_root: /data5/bwang/datasets/memory-bench-example # 本次产物根目录，换 session 时选独立目录。

# 2. 有哪些任务片段。key_1 / intervent_1 / query 是片段 ID，用于下方顺序和依赖引用。
# activity 是 BDDL 活动名，room_id 是具体房间实例名。
segments:
  key_1:
    role: key_task
    activity: mb_chocolate_into_top_cabinet
    room_id: kitchen_0
    depends_on: []                         # 这个片段之前必须完成哪些片段。
  intervent_1:
    role: intervent_task
    activity: turning_on_radio
    room_id: living_room_0
    source: {task_id: 0}                   # 从原始录制根目录下的 task-0000/ 扫描素材。
    depends_on: []
  intervent_2:
    role: intervent_task
    activity: putting_shoes_on_rack
    room_id: corridor_0
    source: {task_id: 22}                  # 对应 task-0022/。
    depends_on: []
  query:
    role: query_task
    activity: mb_retrieve_chocolate_from_top_cabinet
    room_id: kitchen_0
    depends_on: [key_1]                    # Query 必须声明所有记忆 Key。

# 3. 采集按 Key 编号递增，最后追加 Query；下方配置最终拼接顺序。
composition:
  demo_id: 1                              # 第三步选用的完整采集轮次，1 对应 demo_001。
  order_seed: 1                           # 候选顺序的随机分配种子，与实例种子不同。
  instance_id: null                       # null 构建、拼接全部实际实例；整数只处理该实例。
  task_orders:                            # 提供 1～3 个候选顺序，每个任务恰好一次，Q 最后。
    - [key_1, intervent_1, intervent_2, query]
    - [intervent_1, key_1, intervent_2, query]
    - [intervent_2, key_1, intervent_1, query]
# 不填写 Bridge：第三步会在相邻任务之间生成，再由第四步拼接。

# 4. 准备哪些实例、资产和起点。
instance_sampling:
  count: 150                              # 最初请求采样的数量；后续以实际 TRO 和冻结分配为准。
  seed: 0                                 # 实例采样随机种子，也是默认的变体分配种子。
# variant_sampling:                       # 可选：只有需要独立的变体种子时才填写。
#   seed: 123
assets:
  requirements:                           # 配置输入：列出需解析、检查和保护的记忆资产。
    chocolate_bar:
      source: insert                      # scene / insert / scene_or_insert。
      instances: [chocolate_bar.n.01_1]    # Query BDDL 角色；不要填写采样生成的场景物体名。
    target_cabinets:
      source: scene
      instances: [cabinet.n.01_1, cabinet.n.01_2]
    breakfast_table:
      source: scene
      instances: [breakfast_table.n.01_1]

# 5. 最终 Bridge 如何导航；采集切换只恢复本实例的机器人初态。校验默认值由状态比较和机器人边界检查代码提供，仍需实际场景标定。
bridge:
  action_frequency: 30                     # Hz；采集和 Bridge 共用，默认 30。
  max_base_linear_velocity: 0.2            # 与遥操相同的控制器输入；R1Pro ×0.75 后目标为 0.15 m/s。
  max_base_angular_velocity: 0.5           # 与遥操相同的控制器输入；R1Pro ×1.0 后目标为 0.5 rad/s。
  # map_resolution: 0.02                   # 可选，导航地图分辨率，单位 m。

# 6. 最终导出哪些观测，画面如何渲染。
export:
  obs_modalities: [proprio, rgb, depth_linear]
  n_render_iterations: 3                   # 每帧取观测前的渲染刷新次数。
  sensor_config:                          # 传给 OmniGibson 的传感器初始化参数。
    VisionSensor:
      sensor_kwargs: {image_height: 480, image_width: 480}
    "zed_link:Camera:0":
      sensor_kwargs: {horizontal_aperture: 40, image_height: 720, image_width: 720}
